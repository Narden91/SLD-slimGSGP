[project]
name = "sld-slimgsgp"
version = "0.1.0"
description = "SLD-slimGSGP project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
    "slim-gsgp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
eda = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.uv.sources]
slim-gsgp = { path = "slim_v2", editable = true }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
